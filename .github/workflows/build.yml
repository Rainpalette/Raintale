# CI：每次 push / PR 跑一次 debug 构建，保证仓库始终可编译。
# 只做 assembleDebug——本项目无单元测试基建，签名与发布均为手动流程。
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # 与 gradle-daemon-jvm.properties 的 toolchainVersion=21 一致
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
